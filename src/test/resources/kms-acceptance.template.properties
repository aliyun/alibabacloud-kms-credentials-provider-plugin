# The KMS environment KmsAcceptanceIT runs against.
#
# That test performs real writes: it creates roughly ten secrets on the DKMS instance below, drives a
# real Jenkins pipeline over them, and then force-deletes exactly the ones it created. Everything it
# needs to know about its target lives here rather than in code.
#
# Every key can be overridden per run with -D<key>=<value> on the mvn command line, so the run is not
# tied to this environment: point kms.acceptance.endpoint and kms.acceptance.dkms-instance-id at any
# KMS the credentials on the default chain can reach, and the same test validates that one instead.
#
# The run passes this endpoint to withAlibabaCloudKms, so the plugin's step endpoint whitelist applies to
# it and defaults to *.aliyuncs.com; an endpoint outside that also needs
# -Djenkins.alibabacloud-kms.stepEndpointWhitelist=<pattern>. Other than that, nothing here restricts
# which endpoint may be named, and that is deliberate. The run only ever
# deletes secrets it created itself, each tracked per run and named
# <secret-name-prefix>-<runId>-<logicalName>, so aiming it somewhere unintended leaves that place
# with no residue rather than missing data. What a different environment does need is a DKMS instance
# holding an enabled Aliyun_AES_256 key, and, for the managed Rds fixture, a real RDS instance and
# account in that same environment.

# Default target endpoint.
kms.acceptance.endpoint=

# DKMS instance the fixture secrets are created on, and the instance their encryption key is picked
# from (an enabled Aliyun_AES_256 ENCRYPT/DECRYPT key).
kms.acceptance.dkms-instance-id=

# RDS instance and account behind the managed "Rds" fixture, the one secret whose ExtendedConfig has
# to name a real database.
#
# These go stale roughly monthly. When they do, the run fails while creating the "rds" fixture with
# KMS code=Forbidden.ResourceNotFound, status=404. That code is what KMS returns for an unknown
# DBInstanceId, an unknown account name and a permission failure alike, so the message cannot tell
# those apart: suspect these two values before suspecting the code.
kms.acceptance.rds.instance-id=
kms.acceptance.rds.account-name=

# Region the managed-secret targets below live in. KMS needs it in every ExtendedConfig to route the
# read-only DescribeInstances (ECS) and the real account creation (Redis/PolarDB) to the right place.
kms.acceptance.region-id=

# Managed-secret targets for validatesManagedSecretFlatPayload. Each is a real cloud instance in the
# region above, and each secret the test creates against it carries a DoubleUsers/Password subtype that
# KMS resolves into a FLAT {AccountName,AccountPassword} (Redis/PolarDB) or {UserName,Password} (ECS)
# value on GetSecretValue - the contract the plugin's KmsManagedSecretRetriever now parses directly.
#
# ECS is read-only: KMS only calls DescribeInstances and stores the password the test supplies, so the
# test can assert an exact round-trip. Redis and PolarDB are NOT: KMS creates real database accounts
# with server-generated passwords (and leaves a <account>_clone behind), so the test only asserts the
# username it asked for and a non-empty password, and the fixture force-deletes the secret afterwards.
kms.acceptance.ecs.instance-id=
kms.acceptance.redis.instance-id=
kms.acceptance.polardb.cluster-id=
kms.acceptance.polardb.db-name=

# Namespace for everything the run creates. The default target is a gateway shared with other teams,
# and any target may already hold secrets that are not this run's, so these two are what keep a run's
# secrets distinguishable from everybody else's, and what let a residue check find leftovers by tag
# afterwards.
#
# Per-run identifiers are derived from these rather than configured separately: a secret is named
# <secret-name-prefix>-<runId>-<logicalName> and tagged <selector-tag-prefix>:<runId>. Deriving the
# tag keeps it a strict extension of the prefix, which is what makes the run exercise KMS matching
# TagKey as a substring rather than as an exact value.
kms.acceptance.secret-name-prefix=kms-jenkins-it
kms.acceptance.selector-tag-prefix=jenkins:credentials:acceptance
